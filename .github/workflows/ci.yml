name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    name: Unit Tests, Release Lint & R8 Build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Set up JDK 21
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@748248ddd2a24f49513d8f472f81c3a07d4d50e1 # v4.4.4

      - name: Run unit tests, release lint, and R8 release build
        run: ./gradlew testDebugUnitTest lintVitalRelease assembleRelease --stacktrace

      - name: Verify R8 release APK artifact output
        run: |
          if [ ! -f "app/build/outputs/apk/release/Wayfinder-release-unsigned.apk" ] && [ ! -f "app/build/outputs/apk/release/Wayfinder-release.apk" ]; then
            echo "::error::Expected R8 release APK output not found under app/build/outputs/apk/release/"
            exit 1
          fi
