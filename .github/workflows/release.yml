name: Release APK

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v2.6). Leave blank to use v<versionName> from app/build.gradle.kts."
        required: false
        type: string
      draft:
        description: "Create as a draft release (ignored if the release already exists)"
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      is_prerelease: ${{ steps.version.outputs.is_prerelease }}
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Verify signing secrets are configured
        env:
          WAYFINDER_KEYSTORE_BASE64: ${{ secrets.WAYFINDER_KEYSTORE_BASE64 }}
          WAYFINDER_KEYSTORE_PASSWORD: ${{ secrets.WAYFINDER_KEYSTORE_PASSWORD }}
          WAYFINDER_KEY_ALIAS: ${{ secrets.WAYFINDER_KEY_ALIAS }}
          WAYFINDER_KEY_PASSWORD: ${{ secrets.WAYFINDER_KEY_PASSWORD }}
        run: |
          missing=()
          [ -z "$WAYFINDER_KEYSTORE_BASE64" ] && missing+=(WAYFINDER_KEYSTORE_BASE64)
          [ -z "$WAYFINDER_KEYSTORE_PASSWORD" ] && missing+=(WAYFINDER_KEYSTORE_PASSWORD)
          [ -z "$WAYFINDER_KEY_ALIAS" ] && missing+=(WAYFINDER_KEY_ALIAS)
          [ -z "$WAYFINDER_KEY_PASSWORD" ] && missing+=(WAYFINDER_KEY_PASSWORD)
          if [ "${#missing[@]}" -gt 0 ]; then
            echo "::error::Missing required GitHub Actions repository secret(s): ${missing[*]}. Configure them under Settings -> Secrets and variables -> Actions."
            exit 1
          fi

      - name: Resolve tag and verify main-branch ancestry
        id: version
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          version_name=$(sed -nE 's/^[[:space:]]*versionName[[:space:]]*=[[:space:]]*"([^"]+)".*/\1/p' app/build.gradle.kts | head -n1)
          if [ -z "$version_name" ]; then
            echo "::error::Could not parse versionName from app/build.gradle.kts"
            exit 1
          fi

          if [ "$EVENT_NAME" = "push" ]; then
            tag="$GITHUB_REF_NAME"
          else
            tag="${INPUT_TAG:-v${version_name}}"
          fi

          expected_tag="v${version_name}"
          if [ "$tag" != "$expected_tag" ]; then
            echo "::error::Tag '$tag' does not match versionName '$version_name' in app/build.gradle.kts (expected '$expected_tag')."
            exit 1
          fi

          if [[ "$tag" == *-* ]]; then
            is_prerelease="true"
          else
            is_prerelease="false"
            if ! git rev-parse --verify refs/remotes/origin/main >/dev/null 2>&1; then
              git fetch --no-tags "https://github.com/${GITHUB_REPOSITORY}.git" main:refs/remotes/origin/main
            fi
            if ! git merge-base --is-ancestor HEAD refs/remotes/origin/main; then
              echo "::error::Stable release '$tag' must be built from a commit on main (HEAD $GITHUB_SHA is not an ancestor of origin/main)."
              exit 1
            fi
          fi

          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version_name=$version_name" >> "$GITHUB_OUTPUT"
          echo "is_prerelease=$is_prerelease" >> "$GITHUB_OUTPUT"

      - name: Set up JDK 21
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@748248ddd2a24f49513d8f472f81c3a07d4d50e1 # v4.4.4

      - name: Run unit tests
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Decode signing keystore
        env:
          WAYFINDER_KEYSTORE_BASE64: ${{ secrets.WAYFINDER_KEYSTORE_BASE64 }}
          WAYFINDER_KEYSTORE_PATH: ${{ runner.temp }}/wayfinder-release.keystore
        run: |
          printf '%s' "$WAYFINDER_KEYSTORE_BASE64" | tr -d '\r\n ' | base64 --decode > "$WAYFINDER_KEYSTORE_PATH"
          chmod 600 "$WAYFINDER_KEYSTORE_PATH"
          if [ ! -s "$WAYFINDER_KEYSTORE_PATH" ]; then
            echo "::error::Decoded signing keystore at $WAYFINDER_KEYSTORE_PATH is empty."
            exit 1
          fi

      - name: Build signed release APK
        env:
          WAYFINDER_KEYSTORE_PATH: ${{ runner.temp }}/wayfinder-release.keystore
          WAYFINDER_KEYSTORE_PASSWORD: ${{ secrets.WAYFINDER_KEYSTORE_PASSWORD }}
          WAYFINDER_KEY_ALIAS: ${{ secrets.WAYFINDER_KEY_ALIAS }}
          WAYFINDER_KEY_PASSWORD: ${{ secrets.WAYFINDER_KEY_PASSWORD }}
        run: ./gradlew assembleRelease --stacktrace

      - name: Stage and verify Wayfinder.apk
        run: |
          apk_src="app/build/outputs/apk/release/Wayfinder-release.apk"
          if [ ! -f "$apk_src" ]; then
            echo "::error::Expected signed APK not found at $apk_src"
            exit 1
          fi
          cp "$apk_src" "$RUNNER_TEMP/Wayfinder.apk"
          sdk_root="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          apksigner=""
          if [ -n "$sdk_root" ] && [ -d "$sdk_root/build-tools" ]; then
            apksigner=$(find "$sdk_root/build-tools" -maxdepth 2 -name apksigner -type f 2>/dev/null | sort -V | tail -n1)
          fi
          if [ -z "$apksigner" ] || [ ! -x "$apksigner" ]; then
            echo "::error::Could not locate executable apksigner under ANDROID_HOME / ANDROID_SDK_ROOT."
            exit 1
          fi
          "$apksigner" verify --print-certs "$RUNNER_TEMP/Wayfinder.apk"

      - name: Clean up keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/wayfinder-release.keystore"

      - name: Upload verified APK artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: Wayfinder-signed-apk
          path: ${{ runner.temp }}/Wayfinder.apk
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download verified APK artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: Wayfinder-signed-apk
          path: ${{ runner.temp }}/release-asset

      - name: Publish Wayfinder.apk to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          EVENT_NAME: ${{ github.event_name }}
          RELEASE_TAG: ${{ needs.build.outputs.tag }}
          IS_PRERELEASE: ${{ needs.build.outputs.is_prerelease }}
          IS_DRAFT: ${{ inputs.draft }}
        run: |
          apk_file="$RUNNER_TEMP/release-asset/Wayfinder.apk"
          if [ ! -s "$apk_file" ]; then
            echo "::error::Downloaded Wayfinder.apk artifact is missing or empty."
            exit 1
          fi
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" "$apk_file" --clobber
          else
            args=(
              release create "$RELEASE_TAG" "$apk_file"
              --title "Wayfinder (A Files app for Googlebooks) $RELEASE_TAG"
              --generate-notes
            )
            if [ "$IS_PRERELEASE" = "true" ]; then
              args+=(--prerelease)
            fi
            if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
              args+=(--target "$GITHUB_SHA")
              if [ "$IS_DRAFT" = "true" ]; then
                args+=(--draft)
              fi
            fi
            gh "${args[@]}"
          fi
